<!DOCTYPE html>
<html>

<head>
  <title>Alexandria - Book Search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>

  <header class="hero">
    <div class="logo">
  <span class="logo-text">Alexandria</span>
</div>
    <p class="tagline">Find your next great read</p>
    <p class="stat-line" id="statLine"></p>
  </header>

  <div class="search-bar">
    <div class="search-input-wrapper">
      <input type="text" id="searchBox" placeholder="Search for a book, author, or topic..." autocomplete="off">
      <div id="suggestions" class="suggestions-dropdown"></div>
    </div>
    <button onclick="doSearch()">Search</button>
  </div>

  <div id="results"></div>

  <script>
    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightMatch(text, query) {
      if (!query) return text;
      const safeQuery = escapeRegex(query);
      const regex = new RegExp(`(${safeQuery})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // ---- Search History ----
    const HISTORY_KEY = 'alexandria_search_history';
    const MAX_HISTORY = 6;

    function getHistory() {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function saveToHistory(query) {
      if (!query.trim()) return;
      let history = getHistory();
      history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
      history.unshift(query);
      history = history.slice(0, MAX_HISTORY);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      suggestionsDiv.innerHTML = '';
      suggestionsDiv.style.display = 'none';
    }

    function renderHistory() {
      const history = getHistory();
      if (history.length === 0) {
        suggestionsDiv.style.display = 'none';
        return;
      }

      const itemsHtml = history
        .map(q => `<div class="suggestion-item">${q}</div>`)
        .join('');

      suggestionsDiv.innerHTML = `
        <div class="suggestions-header">
          <span>Recent searches</span>
          <span class="clear-history" onclick="clearHistory()">Clear</span>
        </div>
        ${itemsHtml}
      `;
      suggestionsDiv.style.display = 'block';

      suggestionsDiv.querySelectorAll('.suggestion-item').forEach((item, i) => {
        item.addEventListener('click', () => {
          searchBox.value = history[i];
          suggestionsDiv.style.display = 'none';
          doSearch();
        });
      });
    }

    // ---- Autocomplete + History wiring ----
    let debounceTimer;
    const searchBox = document.getElementById('searchBox');
    const suggestionsDiv = document.getElementById('suggestions');

    searchBox.addEventListener('focus', () => {
      if (searchBox.value.length === 0) {
        renderHistory();
      }
    });

    searchBox.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = searchBox.value;

      if (query.length === 0) {
        renderHistory();
        return;
      }

      if (query.length < 2) {
        suggestionsDiv.innerHTML = '';
        suggestionsDiv.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        const response = await fetch('/suggest?q=' + encodeURIComponent(query));
        const suggestions = await response.json();
        renderSuggestions(suggestions, query);
      }, 200);
    });

    function renderSuggestions(suggestions, query) {
      if (suggestions.length === 0) {
        suggestionsDiv.innerHTML = '';
        suggestionsDiv.style.display = 'none';
        return;
      }

      suggestionsDiv.innerHTML = suggestions
        .map(title => `<div class="suggestion-item">${highlightMatch(title, query)}</div>`)
        .join('');
      suggestionsDiv.style.display = 'block';

      suggestionsDiv.querySelectorAll('.suggestion-item').forEach((item, i) => {
        item.addEventListener('click', () => {
          searchBox.value = suggestions[i];
          suggestionsDiv.innerHTML = '';
          suggestionsDiv.style.display = 'none';
          doSearch();
        });
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-input-wrapper')) {
        suggestionsDiv.style.display = 'none';
      }
    });

    async function doSearch() {
      const query = searchBox.value;
      if (!query.trim()) return;

      saveToHistory(query);
      suggestionsDiv.style.display = 'none';

      const response = await fetch('/search?q=' + query);
      const books = await response.json();

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      for (let i = 0; i < books.length; i++) {
        const book = books[i];
        const highlightedTitle = highlightMatch(book.title || 'Untitled', query);
        const highlightedAuthors = highlightMatch(book.authors || 'Unknown author', query);
        const highlightedDescription = highlightMatch(
          book.description ? book.description.slice(0, 200) + (book.description.length > 200 ? '…' : '') : '',
          query
        );
        const year = book.published_date ? book.published_date.slice(0, 4) : '';
        const category = book.categories || '';
        const coverImg = book.thumbnail
          ? `<img src="${book.thumbnail}" alt="${book.title}" class="book-cover">`
          : `<div class="book-cover book-cover-placeholder">📖</div>`;

        resultsDiv.innerHTML += `
          <div class="book-card">
            ${coverImg}
            <div class="book-info">
              <div class="book-title">${highlightedTitle}</div>
              <div class="book-author">by ${highlightedAuthors}</div>
              <div class="book-meta">
                ${year ? `<span>${year}</span>` : ''}
                ${category ? `<span class="book-category">${category}</span>` : ''}
              </div>
              ${highlightedDescription ? `<div class="book-description">${highlightedDescription}</div>` : ''}
            </div>
          </div>
        `;
      }
    }
    // ---- Stats ----
fetch('/stats')
  .then(res => res.json())
  .then(data => {
    document.getElementById('statLine').textContent =
      `Search across ${data.totalBooks.toLocaleString()} books`;
  })
  .catch(() => {
    document.getElementById('statLine').textContent = '';
  });
    // ---- Dark Mode ----
    const THEME_KEY = 'alexandria_theme';
    const themeToggleBtn = document.getElementById('themeToggle');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggleBtn.textContent = '☀️';
      } else {
        document.body.classList.remove('dark-mode');
        themeToggleBtn.textContent = '🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-mode');
      const newTheme = isDark ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, newTheme);
      applyTheme(newTheme);
    }

    // Apply saved theme on page load
    const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
    applyTheme(savedTheme);

  </script>
  <footer class="site-footer">
    <p>Built by Areeba Sajid &middot; Node.js, Express &amp; PostgreSQL</p>
    <a href="https://github.com/areeba022/alexandria" target="_blank">View on GitHub</a>
  </footer>
</body>

</html>
